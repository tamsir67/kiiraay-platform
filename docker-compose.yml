# KIIRAAY — déploiement complet : PostgreSQL/PostGIS + API/Frontend + HTTPS (Caddy)
#   1. cp backend/.env.example .env  puis renseigner les secrets (npm run keys:generate)
#   2. docker compose up -d --build
#   3. docker compose exec app node backend/scripts/seed.js --referentiels-seulement
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: kiiraay
      POSTGRES_USER: kiiraay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiiraay -d kiiraay"]
      interval: 10s
      retries: 5
    # Base non exposée sur Internet : accessible uniquement depuis le réseau Docker

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://kiiraay:${POSTGRES_PASSWORD}@db:5432/kiiraay
      TRUST_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAINE: ${DOMAINE:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
    depends_on: [app]

  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?BACKUP_PASSPHRASE requis}
      RETENTION_JOURS: ${RETENTION_JOURS:-30}
    volumes:
      - ./scripts:/scripts:ro
      - ./sauvegardes:/sauvegardes
    entrypoint: ["sh", "-c", "while true; do /scripts/backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
